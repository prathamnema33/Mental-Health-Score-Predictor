services:
  - type: web
    name: healthcare-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /

  - type: web
    name: healthcare-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PREDICTION_API_URL
        value: https://healthcare-api.onrender.com/predict
